<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ぷうたとぱぴこのリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Kosugi+Maru&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F5F9FB;
    --paper-line: #DCEAF0;
    --ink: #2B3A45;
    --ink-soft: #7C8D97;
    --sky: #5B9BB8;
    --sky-deep: #3D7A98;
    --pale-sky: #BFE0EC;
    --mist: #9FC9DC;
    --coral: #C1666B;
    --accent: var(--sky);
    --accent-deep: var(--sky-deep);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background-color: var(--paper);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g opacity='0.5'><g transform='translate(48,50) rotate(15) scale(1.0)'><g fill='rgb(91,155,184)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(168,55) rotate(-20) scale(0.75)'><g fill='rgb(91,155,184)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(95,150) rotate(35) scale(1.15)'><g fill='rgb(91,155,184)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(185,178) rotate(-10) scale(0.65)'><g fill='rgb(91,155,184)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.5       linear-gradient(180deg, #EAF4F8 0%, var(--paper) 100%);
    background-size: 220px 220px, 100% 100%;
    background-repeat: repeat, no-repeat;
    font-family:'Kosugi Maru', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 16px 14px 60px;
    transition: background 0.25s;
  }
  body.theme-todo{
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g opacity='0.5'><g transform='translate(48,50) rotate(15) scale(1.0)'><g fill='rgb(127,174,92)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(168,55) rotate(-20) scale(0.75)'><g fill='rgb(127,174,92)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(95,150) rotate(35) scale(1.15)'><g fill='rgb(127,174,92)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(185,178) rotate(-10) scale(0.65)'><g fill='rgb(127,174,92)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g><g transform='translate(18,175) rotate(50) scale(0.55)'><g fill='rgb(127,174,92)'><ellipse cx='9.0' cy='0.0' rx='6' ry='10' transform='rotate(-90 9.0 0.0)'/><ellipse cx='2.78' cy='8.56' rx='6' ry='10' transform='rotate(-18 2.78 8.56)'/><ellipse cx='-7.28' cy='5.29' rx='6' ry='10' transform='rotate(54 -7.28 5.29)'/><ellipse cx='-7.28' cy='-5.29' rx='6' ry='10' transform='rotate(126 -7.28 -5.29)'/><ellipse cx='2.78' cy='-8.56' rx='6' ry='10' transform='rotate(198 2.78 -8.56)'/></g><circle cx='0' cy='0' r='4.2' fill='rgb(255,222,120)'/></g></g></svg>"),
      linear-gradient(180deg, #E9F6D8 0%, #F6FAEF 100%);
    background-size: 220px 220px, 100% 100%;
    background-repeat: repeat, no-repeat;
    --accent: #7FAE5C;
    --accent-deep: #5E8A42;
    --paper-line: #DCEACB;
  }
  .board{
    width:100%;
    max-width: 480px;
  }
  .card{
    background: #fff;
    border-radius: 18px;
    padding: 20px 16px;
    box-shadow: 0 10px 30px rgba(61,122,152,0.10);
  }
  header{
    text-align:center;
    margin-bottom: 10px;
    padding: 14px 10px;
    position:relative;
    background: rgba(255,255,255,0.88);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(61,122,152,0.08);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: clamp(19px, 6vw, 25px);
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--sky-deep);
    white-space: nowrap;
  }
  body.theme-todo h1{ color: var(--accent-deep); }
  body.theme-todo header{ box-shadow: 0 6px 18px rgba(94,138,66,0.08); }
  body.theme-todo .card{ box-shadow: 0 10px 30px rgba(94,138,66,0.10); }
  .sub{
    font-family:'Zen Kurenaido', sans-serif;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 4px;
  }
  .tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tab{
    flex:1;
    border: none;
    padding: 8px 6px;
    font-family:'Zen Kurenaido', sans-serif;
    font-size: 13px;
    border-radius: 10px;
    cursor:pointer;
    color: var(--ink-soft);
    background: #fff;
    box-shadow: 0 1px 3px rgba(61,122,152,0.12);
    transition: box-shadow 0.15s, color 0.15s, background 0.15s;
  }
  .tab.shopping.active{
    color: #fff;
    background: linear-gradient(135deg, var(--sky) 0%, var(--sky-deep) 100%);
    box-shadow: 0 4px 10px rgba(61,122,152,0.35);
  }
  .tab.todo.active{
    color: #4A6741;
    background: linear-gradient(135deg, #DCEFC7 0%, #B9DE9C 100%);
    box-shadow: 0 4px 10px rgba(122,152,61,0.25);
  }

  .add-row{
    display:flex;
    gap: 8px;
    margin-bottom: 20px;
    width: 100%;
  }
  .add-row input{
    flex: 1 1 auto;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--paper-line);
    background: #fff;
    font-family:'Zen Kurenaido', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }
  .add-row input:focus{ border-color: var(--accent); }
  .add-row button{
    flex: 0 0 48px;
    width: 48px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--accent-deep);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .add-row button:active{ transform: translateY(2px); box-shadow: none; }

  ul.list{
    list-style:none;
    padding:0;
    margin:0;
  }
  li.item{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 4px 4px;
    font-size: 13px;
    line-height: 1.2;
    border-bottom: 1px solid var(--paper-line);
  }
  li.item:last-child{
    border-bottom: none;
  }
  .check{
    width: 18px; height: 18px;
    flex-shrink:0;
    border-radius: 50%;
    border: 2px solid var(--ink-soft);
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .check.checked{
    background: var(--accent);
    border-color: var(--accent-deep);
    transition: background 0.2s, border-color 0.2s;
  }
  .check.checked::after{
    content:"";
    position:absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .item-text{
    flex:1;
    word-break: break-word;
    transition: color 0.15s;
  }
  .item.done .item-text{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }
  .del{
    background:none;
    border:none;
    color: var(--coral);
    font-size: 15px;
    cursor:pointer;
    padding: 4px 6px;
    opacity: 0.6;
  }
  .del:hover{ opacity: 1; }

  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-family:'Zen Kurenaido', sans-serif;
    padding: 30px 10px;
    font-size: 14px;
  }
  .count{
    text-align:right;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 10px;
    font-family:'Zen Kurenaido', sans-serif;
  }
  .loading{ text-align:center; color: var(--ink-soft); padding: 20px; font-size: 14px;}
  .err{ text-align:center; color: var(--coral); padding: 10px; font-size: 13px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
  <div class="board">
    <header>
      <h1>ぷうたとぱぴこのリスト 🐷</h1>
    </header>

    <div class="tabs">
      <button class="tab shopping active" data-tab="shopping">🛒 買い物</button>
      <button class="tab todo" data-tab="todo">✅ やること</button>
    </div>

    <div class="card">
      <div class="add-row">
        <input id="input" type="text" placeholder="追加する..." maxlength="80">
        <button id="addBtn">＋</button>
      </div>

      <div id="status" class="loading">読み込み中...</div>
      <ul id="list" class="list" style="display:none;"></ul>
      <div id="emptyMsg" class="empty" style="display:none;"></div>
      <div id="count" class="count"></div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0nH7OXFjr2iIvp9O7fN4t5YeDL5vQ1xg",
  authDomain: "pupapi-8dcaf.firebaseapp.com",
  projectId: "pupapi-8dcaf",
  storageBucket: "pupapi-8dcaf.firebasestorage.app",
  messagingSenderId: "919277200535",
  appId: "1:919277200535:web:e2761c461a83e2e82df5d2",
  measurementId: "G-46DKPGWPHL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const listDocRef = doc(db, "futariList", "data");

let currentTab = 'shopping';
let data = { shopping: [], todo: [] };
let nextId = 1;

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('emptyMsg');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const inputEl = document.getElementById('input');

let isRemoteUpdate = false;

onSnapshot(listDocRef, (docSnap) => {
  if(docSnap.exists()){
    const parsed = docSnap.data();
    data = { shopping: parsed.shopping || [], todo: parsed.todo || [] };
    const allIds = [...data.shopping, ...data.todo].map(i => i.id);
    nextId = allIds.length ? Math.max(...allIds) + 1 : 1;
  }
  statusEl.style.display = 'none';
  listEl.style.display = '';
  render();
}, (error) => {
  statusEl.style.display = 'none';
  listEl.style.display = '';
  showError('読み込みに失敗しました。通信環境をご確認ください。');
});

async function saveData(){
  try{
    await setDoc(listDocRef, data);
  }catch(e){
    showError('保存に失敗しました。もう一度お試しください。');
  }
}

function showError(msg){
  const err = document.createElement('div');
  err.className = 'err';
  err.textContent = msg;
  document.querySelector('.board').appendChild(err);
  setTimeout(() => err.remove(), 3000);
}

function render(){
  const items = data[currentTab];
  listEl.innerHTML = '';
  if(items.length === 0){
    emptyEl.style.display = '';
    emptyEl.textContent = currentTab === 'shopping' ? '買うものがありません。追加してみましょう。' : 'やることがありません。追加してみましょう。';
    listEl.style.display = 'none';
  } else {
    emptyEl.style.display = 'none';
    listEl.style.display = '';
    // unchecked first, then checked, preserve relative order within groups
    const sorted = [...items].sort((a,b) => (a.done === b.done) ? 0 : (a.done ? 1 : -1));
    for(const item of sorted){
      const li = document.createElement('li');
      li.className = 'item' + (item.done ? ' done' : '');
      li.innerHTML = `
        <div class="check ${item.done ? 'checked' : ''}" data-id="${item.id}"></div>
        <div class="item-text">${escapeHtml(item.text)}</div>
        <button class="del" data-id="${item.id}">✕</button>
      `;
      listEl.appendChild(li);
    }
  }
  const doneCount = items.filter(i => i.done).length;
  countEl.textContent = items.length ? `${doneCount} / ${items.length} 完了` : '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addItem(){
  const text = inputEl.value.trim();
  if(!text) return;
  data[currentTab].push({ id: nextId++, text, done: false });
  inputEl.value = '';
  render();
  saveData();
}

document.getElementById('addBtn').addEventListener('click', addItem);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') addItem();
});

listEl.addEventListener('click', (e) => {
  const id = parseInt(e.target.dataset.id, 10);
  if(!id) return;
  if(e.target.classList.contains('check')){
    const item = data[currentTab].find(i => i.id === id);
    if(item){ item.done = !item.done; render(); saveData(); }
  } else if(e.target.classList.contains('del')){
    data[currentTab] = data[currentTab].filter(i => i.id !== id);
    render();
    saveData();
  }
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.body.classList.toggle('theme-todo', currentTab === 'todo');
    render();
  });
});

loadData();
</script>
</body>
</html>
